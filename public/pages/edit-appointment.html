<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="../../src/styles/edit.css">

    <title>Update Appointment</title>
</head>
<div class="container">
  <div class="row justify-content-center align-items-center vh-100">

    <div class="col-12 col-sm-10 col-md-6 col-lg-4">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4">

          <h3 class="text-center mb-4 text-warning">
            Update Appointment
          </h3>

          <div class="mb-3">
            <label class="form-label">Appointment Id</label>
            <input type="text" id="appointment_id" class="form-control" readonly>
          </div>

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" id="description" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" id="date" class="form-control">
          </div>

          <div class="d-grid gap-2">
            <button class="btn btn-warning" id="btnupdate">
              Update Appointment
            </button>
            <button class="btn btn-outline-danger" id="btnupdateCancel">
              Cancel
            </button>
          </div>

        </div>
      </div>

    </div>

  </div>
</div>
