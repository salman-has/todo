<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      <div class="card shadow p-4 border-0">

        <h3 class="text-center mb-4 text-primary">Register New User</h3>

        <div class="mb-3">
          <label class="form-label">User Id</label>
          <input type="text" id="user_id" class="form-control" placeholder="Enter User Id">
        </div>

        <div class="mb-3">
          <label class="form-label">User Name</label>
          <input type="text" id="user_name" class="form-control" placeholder="Enter User Name">
        </div>

        <div class="mb-3">
          <label class="form-label">Create Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter Password">
        </div>

        <div class="mb-4">
          <label class="form-label">Mobile</label>
          <input type="text" id="mobile" class="form-control" placeholder="Enter Mobile Number">
        </div>

        <button type="button" class="btn btn-primary w-100 mb-2" id="btnRegister">
          Register
        </button>

        <button id="btnExistingUser" class="btn btn-link w-100">
          Already have an account? Sign In
        </button>

      </div>
    </div>

  </div>
</div>
